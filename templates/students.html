<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a, #172554, #312e81);
            min-height: 100vh;
            color: white;
            padding: 40px 6%;
        }

        /* HEADER */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 45px;
            animation: slideDown 0.7s ease;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .header h1 span {
            color: #38bdf8;
        }

        .header p {
            color: #cbd5e1;
            font-size: 13px;
            margin-top: 5px;
        }

        /* ADD BUTTON */

        .add-btn {
            text-decoration: none;
            padding: 13px 25px;
            border-radius: 12px;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            color: white;
            font-weight: 600;
            box-shadow: 0 5px 20px rgba(56, 189, 248, 0.3);
            transition: 0.3s ease;
        }

        .add-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.5);
        }

        /* STUDENT GRID */

        .con {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            gap: 30px;
        }

        /* STUDENT CARD */

        .card {
            position: relative;
            overflow: hidden;
            padding: 25px;
            border-radius: 22px;

            background: rgba(255, 255, 255, 0.09);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.15);

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.25),
                inset 0 1px 1px rgba(255, 255, 255, 0.15);

            transition: transform 0.4s ease,
                box-shadow 0.4s ease,
                border-color 0.4s ease;

            animation: fadeUp 0.7s ease both;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg,
                    transparent,
                    rgba(255, 255, 255, 0.08),
                    transparent);
            transition: 0.7s;
            pointer-events: none;
        }

        .card:hover::before {
            left: 100%;
        }

        .card:hover {
            transform: translateY(-12px) scale(1.02);

            border-color: rgba(56, 189, 248, 0.6);

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.4),
                0 0 20px rgba(56, 189, 248, 0.15);
        }

        /* STUDENT IMAGE */

        .card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 20px;

            border: 2px solid rgba(255, 255, 255, 0.15);

            transition: transform 0.5s ease;
        }

        .card:hover img {
            transform: scale(1.04);
        }

        /* STUDENT DETAILS */

        .card h3 {
            font-size: 17px;
            margin-bottom: 12px;
            color: #f8fafc;
        }

        .card p {
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 9px;
        }

        .card p strong {
            color: white;
        }

        /* STATUS */

        .status {
            display: inline-block;
            padding: 5px 13px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 5px;
        }

        .present {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.4);
        }

        .absent {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        /* BUTTON CONTAINER */

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 22px;
        }

        /* VIEW BUTTON */

        .view-btn {
            flex: 1;
            text-align: center;
            text-decoration: none;
            padding: 10px;
            border-radius: 10px;

            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            color: white;

            font-size: 12px;
            font-weight: 600;

            transition: 0.3s ease;
        }

        .view-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 18px rgba(14, 165, 233, 0.4);
        }

        /* UPDATE BUTTON */

        .delete-btn-2{
            flex: 1;
            border: none;
            padding: 10px;
            border-radius: 10px;
            background: #355a6b;
            color: #09b3f1;
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .delete-btn-2:hover{
            background: #0ea5e9;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 5px 18px #31b4f0;
        }
        
        /* DELETE BUTTON */

        .delete-btn {
            flex: 1;
            border: none;
            padding: 10px;
            border-radius: 10px;

            background: rgba(239, 68, 68, 0.15);
            color: #f87171;

            font-family: inherit;
            font-size: 12px;
            font-weight: 600;

            cursor: pointer;
            transition: 0.3s ease;
        }

        .delete-btn:hover {
            background: #ef4444;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 5px 18px rgba(239, 68, 68, 0.35);
        }

        /* ANIMATIONS */

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(35px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* RESPONSIVE */

        @media(max-width: 600px) {
            body {
                padding: 25px 5%;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }

            .header h1 {
                font-size: 25px;
            }

            .add-btn {
                width: 100%;
                text-align: center;
            }
        }

        /* REDUCED MOTION */

        @media(prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <div class="header">

        <div>
            <h1>Student <span>Dashboard</span></h1>
            <p>Manage your students in one place.</p>
        </div>

        <a href="/students/add" class="add-btn">
            + Add Student
        </a>

    </div>


    <!-- STUDENT CARDS -->

    <div class="con">

        {% for std in stds %}

        <div class="card">

            <img src="{{std[6]}}" alt="Student Image">

            <h3>ID: {{std[0]}}</h3>

            <h3>{{std[1]}}</h3>

            <p>Age: <strong>{{std[2]}}</strong></p>

            <p>Gender: <strong>{{std[3]}}</strong></p>

            <p>Marks: <strong>{{std[4]}}</strong></p>

            <p>Course: <strong>{{std[5]}}</strong></p>

            <p>
                Status:

                {% if std[7] %}
                <span class="status present">Present</span>
                {% else %}
                <span class="status absent">Absent</span>
                {% endif %}

            </p>

            <!-- ACTION BUTTONS -->

            <div class="actions">

                <a href="/students/{{std[0]}}" class="view-btn">
                    View Details
                </a>
                <a href="/students/{{std[0]}}/update" method="post">
                    <button type="submit" class="delete-btn-2">Update</button>
                </a>
                <form action="/students/{{std[0]}}/delete" method="POST"
                    onsubmit="return confirm('Are you sure you want to delete this student?');" style="flex: 1;">

                    <button type="submit" class="delete-btn">
                        Delete
                    </button>
                </form>
                
            </div>

        </div>

        {% endfor %}

    </div>

</body>

</html>
